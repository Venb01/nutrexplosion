<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NUTREXPLOSION · Reto de los 10 segundos</title>
<style>
:root{color-scheme:dark;--bg:#07090c;--card:#10151b;--red:#ff1e1e;--tx:#fff;--mut:#8b95a1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;min-height:100%;background:radial-gradient(120% 60% at 50% 0,#2a0a0a 0,var(--bg) 60%) fixed;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:460px;margin:0 auto;padding:16px 18px 28px;text-align:center}
.logo{width:230px;max-width:70%;margin:4px auto 8px;display:block;animation:pop 1s ease-out}
h1{font-size:25px;line-height:1.1;margin:6px 0 4px;font-weight:900;font-style:italic;text-transform:uppercase}
h1 b{color:var(--red)}
p.sub{margin:0 0 14px;color:var(--mut);font-size:14px}
.dial{position:relative;width:min(78vw,320px);aspect-ratio:1;margin:0 auto 16px}
.dial svg{position:absolute;inset:0;transform:rotate(-90deg)}
.dial circle{fill:none;stroke-width:9}
.bg{stroke:#1b232c}.fg{stroke:var(--red);stroke-linecap:round;filter:drop-shadow(0 0 8px var(--red))}
.read{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#t{font-size:clamp(46px,16vw,70px);font-weight:900;font-variant-numeric:tabular-nums;font-style:italic;letter-spacing:-1px}
#t.hid{color:var(--red);animation:blink .8s infinite}
#hint{font-size:13px;color:var(--mut);margin-top:2px;min-height:18px}
button{font:inherit;border:0;cursor:pointer;color:#fff}
#go{width:100%;padding:20px;border-radius:18px;font-size:24px;font-weight:900;font-style:italic;text-transform:uppercase;background:linear-gradient(180deg,#ff4040,#c00);box-shadow:0 8px 0 #700,0 0 30px #f003;transition:transform .05s,box-shadow .05s;animation:pulse 1.6s infinite}
#go:active{transform:translateY(6px);box-shadow:0 2px 0 #700}
#go.run{background:linear-gradient(180deg,#fff,#ddd);color:#c00;box-shadow:0 8px 0 #999;animation:none}
#msg{min-height:48px;margin:14px 0 6px;font-weight:700;font-size:17px}
.stats{display:flex;gap:10px}.stats div{flex:1;background:var(--card);border-radius:14px;padding:10px;font-size:12px;color:var(--mut)}
.stats b{display:block;color:var(--tx);font-size:20px}
.ov{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
.ov.on{display:flex}
.box{background:var(--card);border:2px solid var(--red);border-radius:24px;padding:24px 20px;width:100%;max-width:380px;animation:pop .5s;box-shadow:0 0 50px #f004}
.box h2{margin:0 0 6px;font-size:30px;font-style:italic;font-weight:900;text-transform:uppercase}
.big{font-size:64px;font-weight:900;color:var(--red);line-height:1}
.code{margin:14px 0;padding:14px;border:2px dashed var(--red);border-radius:14px;font-size:28px;font-weight:900;letter-spacing:4px;user-select:all}
.b2{display:block;width:100%;padding:15px;border-radius:14px;font-weight:800;font-size:16px;margin-top:10px;background:#1d2630}
.wa{background:#18a84a}
canvas{position:fixed;inset:0;pointer-events:none;z-index:9}
.shake{animation:shake .4s}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pulse{50%{box-shadow:0 8px 0 #700,0 0 50px #f008}}
@keyframes blink{50%{opacity:.35}}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
</style></head><body>

const CODE="NUTRE15", WA="591XXXXXXXX"; // <- cambia por tu número de WhatsApp
const $=i=>document.getElementById(i);
let st=0,run=false,raf,lucky=false,tries=0,total=0,best=null,ac;

function beep(f,d,tp){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=tp||"square";o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function stats(){$("n").textContent=total;$("best").textContent=best?(best).toFixed(2)+"s":"--"}

let dr,lastT=-1;
function drone(on){try{if(on){ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();dr=ac.createOscillator();const g=ac.createGain();dr.type="sawtooth";dr.frequency.value=70;g.gain.value=.025;dr.connect(g);g.connect(ac.destination);dr.start()}else if(dr){dr.stop();dr=null}}catch(e){}}

 st=performance.now();$("go").textContent="¡PARAR!";$("go").classList.add("run");$("msg").textContent="";$("hint").textContent="Llega a 10.00";beep(660,.12);vib(30);lastT=-1;drone(1);tick()}

 let s=(performance.now()-st)/1000;
 const win=s.toFixed(2)==="10.00",t=$("t");t.className="";t.textContent=s.toFixed(2);
 $("go").textContent="Intentar de nuevo";$("go").classList.remove("run");
 const d=Math.abs(s-10);if(!best||d<Math.abs(best-10)){best=s;}

 else{beep(200,.35,"sawtooth");vib(120);$("dial").classList.remove("shake");void $("dial").offsetWidth;$("dial").classList.add("shake");
  const df=(s-10);$("msg").textContent=(df<0?"Te faltaron ":"Te pasaste por ")+Math.abs(df).toFixed(2)+"s "+(Math.abs(df)<.5?"🔥 ¡Casi!":"😅");
  $("hint").textContent="Otra vez, tú puedes"}}

function confetti(){const c=$("cv"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
 const p=Array.from({length:140},()=>({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*16,vy:Math.random()*-16-4,s:Math.random()*8+4,c:["#ff1e1e","#fff","#ffb300"][Math.random()*3|0],l:100}));
 (function f(){x.clearRect(0,0,c.width,c.height);let a=0;p.forEach(q=>{if(q.l<=0)return;a++;q.x+=q.vx;q.y+=q.vy;q.vy+=.4;q.l--;x.fillStyle=q.c;x.fillRect(q.x,q.y,q.s,q.s)});a&&requestAnimationFrame(f)})()}
